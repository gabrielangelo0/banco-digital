spring:
  application:
    name: banco
  datasource:
    # Credenciais vêm do ambiente. Os defaults servem apenas ao Postgres
    # descartável do docker-compose local; em qualquer outro lugar, defina
    # DB_URL, DB_USER e DB_PASSWORD. Ver .env.example.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
    hikari:
      # lock_timeout no Postgres: esperar para sempre por um lock e pior do que
      # falhar rapido. A ordenacao de locks torna o deadlock impossivel, mas uma
      # transacao lenta ainda pode segurar a linha; aqui ela desiste em 3s.
      connection-init-sql: "SET lock_timeout = '3000ms'"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
